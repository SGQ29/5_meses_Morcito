<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felices 5 meses, Mi amor ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: #f2eee5;
            color: #4a5240;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 15px;
            text-align: center;
        }

        .card {
            max-width: 420px;
            width: 100%;
            background: #fcfbf7;
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2ddd3;
        }

        h1 {
            font-size: 28px;
            color: #5c6850;
            font-weight: normal;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
            line-height: 1.3;
        }

        /* Foto principal con forma de corazón */
        .heart-frame {
            position: relative;
            width: 220px;
            height: 200px;
            margin: 0 auto 20px auto;
            clip-path: path("M 110 185 C 110 185 10 120 10 60 C 10 25 38 5 70 5 C 90 5 102 16 110 25 C 118 16 130 5 150 5 C 182 5 210 25 210 60 C 210 120 110 185 110 185 Z");
            background: #b5c2a3;
            padding: 4px;
        }

        #galeriaFoto {
            width: 100%;
            height: 100%;
            object-fit: cover;
            clip-path: path("M 110 185 C 110 185 10 120 10 60 C 10 25 38 5 70 5 C 90 5 102 16 110 25 C 118 16 130 5 150 5 C 182 5 210 25 210 60 C 210 120 110 185 110 185 Z");
            transition: opacity 0.4s ease;
        }

        .controles {
            margin: 10px 0 25px 0;
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        button {
            padding: 8px 18px;
            font-size: 13px;
            border: 1px solid #a8b896;
            border-radius: 20px;
            background: #f4f7f0;
            color: #4a5240;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #8fa17a;
            color: #ffffff;
        }

        /* Calendario */
        .calendar-box {
            background: #f7f5ed;
            border-radius: 16px;
            padding: 18px 15px;
            margin-bottom: 25px;
            border: 1px solid #e5dfd3;
        }

        .calendar-title {
            font-size: 15px;
            letter-spacing: 2px;
            color: #728062;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .weekdays, .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            font-size: 12px;
        }

        .weekdays {
            color: #8fa07e;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .day {
            padding: 5px 0;
            color: #58634c;
        }

        .day.special {
            background-color: #a0b28e;
            color: white;
            font-weight: bold;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            margin: 0 auto;
        }

        /* Texto Poético */
        .message {
            font-size: 15px;
            line-height: 1.6;
            color: #505a46;
            font-style: italic;
            margin-bottom: 15px;
            padding: 0 10px;
        }

        .firma {
            font-size: 16px;
            color: #728062;
            font-style: normal;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Felices 5 meses,<br>Mi amor</h1>

        <!-- Foto principal en corazón -->
        <div class="heart-frame">
            <img id="galeriaFoto" src="amor.jpg" alt="Foto juntos">
        </div>

        <div class="controles">
            <button onclick="fotoAnterior()">❮ Anterior</button>
            <button onclick="fotoSiguiente()">Siguiente ❯</button>
        </div>

        <!-- Calendario con el día 8 marcado -->
        <div class="calendar-box">
            <div class="calendar-title">OCTUBRE 2026</div>
            <div class="weekdays">
                <span>LU</span><span>MA</span><span>MI</span><span>JU</span><span>VI</span><span>SA</span><span>DO</span>
            </div>
            <div class="days-grid">
                <span></span><span></span><span></span><span>1</span><span>2</span><span>3</span><span>4</span>
                <span>5</span><span>6</span><span>7</span><span class="day special">8</span><span>9</span><span>10</span><span>11</span>
                <span>12</span><span>13</span><span>14</span><span>15</span><span>16</span><span>17</span><span>18</span>
                <span>19</span><span>20</span><span>21</span><span>22</span><span>23</span><span>24</span><span>25</span>
                <span>26</span><span>27</span><span>28</span><span>29</span><span>30</span><span>31</span>
            </div>
        </div>

        <!-- Texto Poético Sencillo -->
        <div class="message">
            Me gusta la compañía que tenemos, me haces feliz, me siento en paz. Gracias por tu paciencia.
        </div>

        <div class="firma">Polar ❤️</div>
    </div>

    <script>
        // Lista de tus fotos
        const fotos = [
            "amor.jpg",
            "feli.jpg",
            "felij.jpg",
            "familia.jpg",
            "nojada.jpg",
            "Ojos.jpg",
            "Diosa.jpg",
            "divina.jpg",
            "bonita.jpg",
            "cariño.jpg"
        ];

        let indice = 0;
        const img = document.getElementById("galeriaFoto");

        function mostrarFoto() {
            img.style.opacity = 0;
            setTimeout(() => {
                img.src = fotos[indice];
                img.style.opacity = 1;
            }, 300);
        }

        function fotoSiguiente() {
            indice = (indice + 1) % fotos.length;
            mostrarFoto();
        }

        function fotoAnterior() {
            indice = (indice - 1 + fotos.length) % fotos.length;
            mostrarFoto();
        }

        // Cambio automático cada 4 segundos
        setInterval(fotoSiguiente, 4000);
    </script>

</body>

</html>
