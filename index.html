<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felices 5 Meses, Mi Amor ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: #f4f1ea;
            color: #4a5240;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px 15px;
            text-align: center;
        }

        .card {
            max-width: 480px;
            width: 100%;
            background: #fcfbf7;
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2ddd3;
        }

        h1 {
            font-size: 26px;
            color: #5c6850;
            font-weight: normal;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        /* Foto principal en corazón */
        .heart-frame {
            width: 220px;
            height: 200px;
            margin: 0 auto 15px auto;
            clip-path: path("M 110 185 C 110 185 10 120 10 60 C 10 25 38 5 70 5 C 90 5 102 16 110 25 C 118 16 130 5 150 5 C 182 5 210 25 210 60 C 210 120 110 185 110 185 Z");
            background: #b5c2a3;
            padding: 4px;
        }

        #galeriaFoto {
            width: 100%;
            height: 100%;
            object-fit: cover;
            clip-path: path("M 110 185 C 110 185 10 120 10 60 C 10 25 38 5 70 5 C 90 5 102 16 110 25 C 118 16 130 5 150 5 C 182 5 210 25 210 60 C 210 120 110 185 110 185 Z");
            transition: opacity 0.4s ease;
        }

        .controles {
            margin: 10px 0 20px 0;
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        button {
            padding: 8px 18px;
            font-size: 13px;
            border: 1px solid #a8b896;
            border-radius: 20px;
            background: #f4f7f0;
            color: #4a5240;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #8fa17a;
            color: #ffffff;
        }

        /* Árbol interactivo con corazones */
        .tree-container {
            position: relative;
            width: 100%;
            height: 260px;
            margin: 15px 0 25px 0;
            background: #f7f5ed;
            border-radius: 18px;
            border: 1px solid #e5dfd3;
            overflow: hidden;
        }

        .trunk {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 35px;
            height: 100px;
            background: #8a735c;
            border-radius: 10px 10px 0 0;
        }

        .branch-left {
            position: absolute;
            bottom: 60px;
            left: 42%;
            width: 35px;
            height: 12px;
            background: #8a735c;
            transform: rotate(-30deg);
            border-radius: 5px;
        }

        .branch-right {
            position: absolute;
            bottom: 70px;
            right: 42%;
            width: 35px;
            height: 12px;
            background: #8a735c;
            transform: rotate(30deg);
            border-radius: 5px;
        }

        /* Hojas de corazones con texto */
        .heart-leaf {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #ffffff;
            font-size: 10px;
            font-weight: bold;
            padding: 8px;
            clip-path: path("M 25 42 C 25 42 2 27 2 13 C 2 5 8 1 15 1 C 20 1 23 4 25 6 C 27 4 30 1 35 1 C 42 1 48 5 48 13 C 48 27 25 42 25 42 Z");
            transition: transform 0.3s ease;
        }

        .heart-leaf:hover {
            transform: scale(1.15);
        }

        /* Variaciones de colores suaves y ubicaciones */
        .leaf-1 { width: 90px; height: 80px; background: #a2b38b; top: 25px; left: 18%; font-size: 9px; }
        .leaf-2 { width: 100px; height: 90px; background: #c2a68c; top: 15px; left: 38%; font-size: 10px; }
        .leaf-3 { width: 95px; height: 85px; background: #8fa17a; top: 30px; right: 16%; font-size: 9px; }
        .leaf-4 { width: 105px; height: 95px; background: #b5c2a3; top: 80px; left: 10%; font-size: 9.5px; }
        .leaf-5 { width: 110px; height: 100px; background: #9bb088; top: 70px; left: 36%; font-size: 10px; }
        .leaf-6 { width: 100px; height: 90px; background: #d0beaa; top: 85px; right: 12%; font-size: 9.5px; }

        .leaf-text {
            transform: translateY(-4px);
            padding: 0 4px;
            line-height: 1.1;
        }

        /* Calendario */
        .calendar-box {
            background: #f7f5ed;
            border-radius: 16px;
            padding: 16px 12px;
            margin-bottom: 20px;
            border: 1px solid #e5dfd3;
        }

        .calendar-title {
            font-size: 14px;
            letter-spacing: 2px;
            color: #728062;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .weekdays, .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            font-size: 12px;
        }

        .weekdays {
            color: #8fa07e;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .day {
            padding: 4px 0;
            color: #58634c;
        }

        .day.special {
            background-color: #a0b28e;
            color: white;
            font-weight: bold;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            margin: 0 auto;
        }

        /* Mensaje Poético */
        .message {
            font-size: 15px;
            line-height: 1.6;
            color: #505a46;
            font-style: italic;
            margin-bottom: 15px;
            padding: 0 10px;
        }

        .firma {
            font-size: 16px;
            color: #728062;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Felices 5 meses,<br>Mi amor</h1>

        <!-- Foto principal en corazón -->
        <div class="heart-frame">
            <img id="galeriaFoto" src="amor.jpg" alt="Foto juntos">
        </div>

        <div class="controles">
            <button onclick="fotoAnterior()">❮ Anterior</button>
            <button onclick="fotoSiguiente()">Siguiente ❯</button>
        </div>

        <!-- Árbol con hojas de corazón y frases -->
        <div class="tree-container">
            <div class="trunk"></div>
            <div class="branch-left"></div>
            <div class="branch-right"></div>

            <div class="heart-leaf leaf-1"><span class="leaf-text">Te amo</span></div>
            <div class="heart-leaf leaf-2"><span class="leaf-text">Eres la mejor</span></div>
            <div class="heart-leaf leaf-3"><span class="leaf-text">Gracias por todo</span></div>
            <div class="heart-leaf leaf-4"><span class="leaf-text">Nunca me cansaré de ti</span></div>
            <div class="heart-leaf leaf-5"><span class="leaf-text">Mi paz</span></div>
            <div class="heart-leaf leaf-6"><span class="leaf-text">Juntos siempre</span></div>
        </div>

        <!-- Calendario con el día 8 destacado -->
        <div class="calendar-box">
            <div class="calendar-title">OCTUBRE 2026</div>
            <div class="weekdays">
                <span>LU</span><span>MA</span><span>MI</span><span>JU</span><span>VI</span><span>SA</span><span>DO</span>
            </div>
            <div class="days-grid">
                <span></span><span></span><span></span><span>1</span><span>2</span><span>3</span><span>4</span>
                <span>5</span><span>6</span><span>7</span><span class="day special">8</span><span>9</span><span>10</span><span>11</span>
                <span>12</span><span>13</span><span>14</span><span>15</span><span>16</span><span>17</span><span>18</span>
                <span>19</span><span>20</span><span>21</span><span>22</span><span>23</span><span>24</span><span>25</span>
                <span>26</span><span>27</span><span>28</span><span>29</span><span>30</span><span>31</span>
            </div>
        </div>

        <!-- Frase Poética Sencilla -->
        <div class="message">
            Me gusta la compañía que tenemos, me haces feliz, me siento en paz. Gracias por tu paciencia.
        </div>

        <div class="firma">Koalita ❤️</div>
    </div>

    <script>
        const fotos = [
            "amor.jpg",
            "feli.jpg",
            "felij.jpg",
            "familia.jpg",
            "nojada.jpg",
            "Ojos.jpg",
            "Diosa.jpg",
            "divina.jpg",
            "bonita.jpg",
            "cariño.jpg"
        ];

        let indice = 0;
        const img = document.getElementById("galeriaFoto");

        function mostrarFoto() {
            img.style.opacity = 0;
            setTimeout(() => {
                img.src = fotos[indice];
                img.style.opacity = 1;
            }, 300);
        }

        function fotoSiguiente() {
            indice = (indice + 1) % fotos.length;
            mostrarFoto();
        }

        function fotoAnterior() {
            indice = (indice - 1 + fotos.length) % fotos.length;
            mostrarFoto();
        }

        setInterval(fotoSiguiente, 4000);
    </script>

</body>

</html>
